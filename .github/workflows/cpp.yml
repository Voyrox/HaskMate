name: C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache CMake build directory
        uses: actions/cache@v3
        with:
          path: |
            build
          key: ${{ runner.os }}-cmake-${{ hashFiles('CMakeLists.txt') }}-${{ hashFiles('src/**', 'include/**', 'library/**') }}
          restore-keys: |
            ${{ runner.os }}-cmake-

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release
